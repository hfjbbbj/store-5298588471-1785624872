<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لقراند</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #f4f4f9;
            text-align: center;
            padding: 20px;
            direction: rtl;
        }
        .header {
            background: #2c3e50;
            color: #fff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .auth-box, .product {
            background: #fff;
            padding: 20px;
            margin: 15px auto;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        input {
            padding: 10px;
            margin: 8px 0;
            width: 90%;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: right;
        }
        button {
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            width: 95%;
            font-weight: bold;
        }
        .price {
            color: #e74c3c;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>لقراند</h1>
        <p>كل شي متوفر غواصه وغيره</p>
    </div>
    
    <div class="auth-box">
        <h3>تسجيل حساب جديد</h3>
        <input type="text" id="phone" placeholder="أدخل رقم الجوال أو البريد">
        <button onclick="alert('تم إرسال رمز التحقق بنجاح!')">دخول / إنشاء حساب</button>
    </div>

    <div class="product">
        <h3>5غواصات</h3>
        <p class="price">السعر: 3﷼</p>
    </div>
</body>
</html>
